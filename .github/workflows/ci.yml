name: CI

on:
  pull_request:
    branches: [ development ]
  push:
    branches: [ development ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=SmartBudget_Test;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False;

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Wait for SQL Server
        shell: bash
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/localhost/1433) >/dev/null 2>&1; then
              echo "SQL Server is accepting connections."
              exit 0
            fi
            echo "Waiting for SQL Server... ($i/30)"
            sleep 2
          done
          echo "SQL Server did not start in time."
          exit 1    
          
      - run: dotnet restore
      - run: dotnet test --configuration Release
